name: urls

services:
  app:
    build: .
    image: urls-app:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - urls_data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [internal]

networks:
  internal:

volumes:
  urls_data:
  caddy_data:
  caddy_config:
