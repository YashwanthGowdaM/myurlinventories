name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - run: docker build -t urls-app:ci .

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          HOST: ${{ secrets.VM_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts

      - name: Upload code
        env:
          TARGET: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
        run: |
          rsync -az --delete --exclude '.git' --exclude '.github' --exclude 'tests' --exclude '.env' \
            ./ "$TARGET:urls/"

      - name: Build and restart
        env:
          TARGET: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
        run: |
          ssh "$TARGET" 'set -e; cd ~/urls
            docker compose up -d --build --remove-orphans --wait --wait-timeout 120
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            docker image prune -f'

      - name: Smoke test
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors https://urls.yashwanthgowdam.in/healthz
